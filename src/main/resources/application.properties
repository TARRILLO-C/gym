# =============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# open-in-view=true: necesario para cargar relaciones lazy en la respuesta JSON
spring.jpa.open-in-view=true
# Batch size para reducir número de queries en colecciones
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Logging: solo errores críticos (reducir overhead de logging)
logging.level.com.gym=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.web.servlet.mvc.method.annotation=ERROR

