# # # =============================================
# # CONFIGURACIÓN DE BASE DE DATOS - MySQL
# # =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true}
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# CONFIGURACIÓN DE HIKARICP (Connection Pool)
# =============================================
# Conexiones mínimas siempre abiertas (evita reconectar en cada petición)
spring.datasource.hikari.minimum-idle=3
# Máximo de conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=10
# Tiempo máximo de espera para obtener una conexión (ms)
spring.datasource.hikari.connection-timeout=20000
# Tiempo máximo de inactividad antes de cerrar una conexión idle
spring.datasource.hikari.idle-timeout=300000
# Tiempo máximo de vida de una conexión (10 min)
spring.datasource.hikari.max-lifetime=600000
# Keepalive para evitar que el servidor cierre conexiones inactivas
spring.datasource.hikari.keepalive-time=60000
# Nombre del pool
spring.datasource.hikari.pool-name=GymHikariPool

